name: CI

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["main"]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        run: npm ci

      - name: Install server-cf dependencies
        run: cd server-cf && npm ci

      - name: Lint (frontend)
        run: npm run lint

      - name: Type check (frontend)
        run: npm run typecheck

      - name: Frontend test
        run: npm run test:run

      - name: Type check (server-cf)
        run: cd server-cf && npm run typecheck

      - name: Server test (server-cf)
        run: cd server-cf && npm run test

      - name: Build frontend
        run: npm run build

  # 依赖 main 分支 push 时的自动部署（Cloudflare Pages + Workers）。
  # 仅当仓库配置了 CLOUDFLARE_API_TOKEN 时执行；未配置则自动跳过，避免 CI 误红。
  deploy:
    if: ${{ github.ref == 'refs/heads/main' && secrets.CLOUDFLARE_API_TOKEN != '' }}
    runs-on: ubuntu-latest
    needs: lint-test
    permissions:
      contents: read
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        run: npm ci

      - name: Install server-cf dependencies
        run: cd server-cf && npm ci

      - name: Build frontend
        run: npm run build

      - name: Deploy frontend to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ vars.CF_PAGES_PROJECT || 'suisui-cf' }}

      - name: Deploy Worker to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: server-cf
          command: deploy
