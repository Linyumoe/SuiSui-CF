name: CI

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["main"]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: server-go/go.sum

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx vue-tsc --noEmit

      - name: Frontend test
        run: npm run test:run

      - name: Build
        run: npm run build

      - name: Copy frontend for Go embed
        run: cp -r dist server-go/

      - name: Go vet
        run: cd server-go && go vet ./... 2>&1

      - name: Go test
        run: cd server-go && go test -v ./... -count=1 -timeout 120s 2>&1