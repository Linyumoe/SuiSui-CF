name = "suisui-cf"
main = "src/index.ts"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]

# ── 首次部署步骤 ─────────────────────────────────────────────
# 1. npx wrangler d1 create suisui-cf         # 创建数据库，把输出的 database_id 填到下面
# 2. npx wrangler r2 bucket create suisui-cf-uploads   # 创建存储桶
# 3. npm run db:migrate:remote              # 应用数据库迁移
# 4. npx wrangler secret put GITHUB_TOKEN   # 可选：GitHub API 代理 token
# 5. npm run deploy                         # 部署 Worker
# ─────────────────────────────────────────────────────────────

[[d1_databases]]
binding = "DB"
database_name = "suisui-cf"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[[r2_buckets]]
binding = "UPLOADS"
bucket_name = "suisui-cf-uploads"
