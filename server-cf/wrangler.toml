name = "suisui-cf"
main = "src/index.ts"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]

# ── 首次部署步骤 ─────────────────────────────────────────────
# 1. npx wrangler d1 create suisui-cf         # 创建数据库，把输出的 database_id 填到下面
# 2. npm run db:migrate:remote              # 应用数据库迁移
# 3. npx wrangler secret put GITHUB_TOKEN   # 可选：GitHub API 代理 token
# 4. npm run deploy                         # 部署 Worker
# ─────────────────────────────────────────────────────────────

[[d1_databases]]
binding = "DB"
database_name = "suisui-cf"
database_id = "a7e2e105-0e1f-4762-b0fb-356f1e91d0d6"

[[kv_namespaces]]
binding = "UPLOADS"
id = "9597b0310afa4d51bd9ef6de8ae08e8e"
